<style>
  :root{
    --ink:#14110d;      /* warm black */
    --cream:#fff4d6;    /* text on dark */
    --auto:#f2b705;     /* auto-rickshaw yellow */
    --leaf:#0f5b3a;     /* auto-rickshaw green */
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--ink);color:var(--cream);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}

  /* One phone-shaped stage; full screen on phones, centered column on desktop */
  .stage{position:relative;height:100vh;height:100dvh;max-width:520px;margin:0 auto;overflow:hidden;background:var(--ink)}
  .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .shade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to top,rgba(20,17,13,.96) 0%,rgba(20,17,13,.88) 30%,rgba(20,17,13,.35) 55%,rgba(20,17,13,0) 72%)}

  .content{position:absolute;left:0;right:0;bottom:0;padding:0 22px max(22px,env(safe-area-inset-bottom));animation:rise .8s .15s cubic-bezier(.2,.7,.2,1) both}
  h1{margin:0 0 10px;font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:800;font-size:clamp(34px,10.5vw,50px);line-height:1.02;letter-spacing:-.02em}
  .sub{margin:0 0 22px;font-size:clamp(15px,4.2vw,17px);line-height:1.45;color:rgba(255,244,214,.82);max-width:34ch}

  .btns{display:flex;flex-direction:column;gap:10px}
  .btn{display:block;width:100%;padding:17px 20px;border-radius:16px;text-align:center;text-decoration:none;font-weight:700;font-size:17px}
  .primary{background:var(--auto);color:var(--ink);box-shadow:0 8px 24px rgba(242,183,5,.28)}
  .primary:active{transform:scale(.98)}
  .secondary{background:rgba(15,91,58,.55);color:var(--cream);border:1.5px solid rgba(255,244,214,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .soon{background:rgba(255,255,255,.08);color:rgba(255,244,214,.6);cursor:not-allowed}
  .store{display:flex;align-items:center;justify-content:center;gap:12px}
  .store img{display:block;width:auto;height:28px}
  .btn:focus-visible{outline:3px solid var(--cream);outline-offset:3px}

  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.content{animation:none}}
</style>
</head>
