<style>
  html,body{height:100%}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F2B705;font-family:Arial,sans-serif;text-align:center;padding:20px;box-sizing:border-box;overflow:hidden}

  .video-bg{position:fixed;inset:0;overflow:hidden;z-index:-2;pointer-events:none}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:-1}

  h1{margin:0 0 8px;color:#fff}
  p{color:#fff;margin:0 0 24px}
