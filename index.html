<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#14110d" />
<title>NESH Taxi and Delivery Services</title>
<meta name="description" content="NESH Taxi and Delivery Services - Fastest delivery in your area. Book taxis, order groceries and food online with NESH." />
<link rel="canonical" href="https://nesh-group.github.io/" />
<link rel="icon" href="NESH-APP/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet" />
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "NESH Taxi and Delivery",
  "alternateName": "NESH",
  "url": "https://nesh-group.github.io/"
}
</script>
<style>
  :root{
    --ink:#14110d;      /* warm black */
    --cream:#fff4d6;    /* text on dark */
    --auto:#f2b705;     /* auto-rickshaw yellow */
    --leaf:#0f5b3a;     /* auto-rickshaw green */
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--ink);color:var(--cream);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}

  /* One phone-shaped stage; full screen on phones, centered column on desktop */
  .stage{position:relative;height:100vh;height:100dvh;max-width:520px;margin:0 auto;overflow:hidden;background:var(--ink)}
  .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .shade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to top,rgba(20,17,13,.96) 0%,rgba(20,17,13,.88) 30%,rgba(20,17,13,.35) 55%,rgba(20,17,13,0) 72%)}

  .content{position:absolute;left:0;right:0;bottom:0;padding:0 22px max(22px,env(safe-area-inset-bottom));animation:rise .8s .15s cubic-bezier(.2,.7,.2,1) both}
  h1{margin:0 0 10px;font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:800;font-size:clamp(34px,10.5vw,50px);line-height:1.02;letter-spacing:-.02em}
  .sub{margin:0 0 22px;font-size:clamp(15px,4.2vw,17px);line-height:1.45;color:rgba(255,244,214,.82);max-width:34ch}

  .btns{display:flex;flex-direction:column;gap:10px}
  .btn{display:block;width:100%;padding:17px 20px;border-radius:16px;text-align:center;text-decoration:none;font-weight:700;font-size:17px}
  .primary{background:var(--auto);color:var(--ink);box-shadow:0 8px 24px rgba(242,183,5,.28)}
  .primary:active{transform:scale(.98)}
  .secondary{background:rgba(15,91,58,.55);color:var(--cream);border:1.5px solid rgba(255,244,214,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .soon{background:rgba(255,255,255,.08);color:rgba(255,244,214,.6);cursor:not-allowed}
  .btn:focus-visible{outline:3px solid var(--cream);outline-offset:3px}

  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.content{animation:none}}
</style>
</head>
<body>
  <main class="stage">
    <video autoplay muted loop playsinline preload="auto" poster="poster.jpg"
      disablepictureinpicture disableremoteplayback
      controlslist="nodownload noplaybackrate noremoteplayback" aria-hidden="true">
      <source src="video.mp4" type="video/mp4" />
    </video>
    <div class="shade"></div>

    <div class="content">
      <h1>Your ride and your dinner, one app.</h1>
      <p class="sub">Book a taxi or auto, and order groceries and food from shops near you.</p>
      <div class="btns">
        <a class="btn primary" href="NESH-APP/">Open NESH App</a>
        <a id="playBtn" class="btn secondary soon">Play Store: Coming Soon</a>
      </div>
    </div>
  </main>

<script>
  // Early-access testers: share https://nesh-group.github.io/?early=1
  // Everyone else sees "Coming Soon". Remove this block when the app is public.
  (function(){
    var btn=document.getElementById('playBtn');
    var early=false;
    try{
      if(new URLSearchParams(location.search).has('early')) localStorage.setItem('neshEarly','1');
      early=localStorage.getItem('neshEarly')==='1';
    }catch(e){
      early=/[?&]early/.test(location.search);
    }
    if(early){
      btn.href='https://play.google.com/store/apps/details?id=com.neshgroup.nesh';
      btn.target='_blank';btn.rel='noopener';
      btn.textContent='Open Play Store';
      btn.className='btn secondary';
    }
  })();
</script>
</body>
</html>
