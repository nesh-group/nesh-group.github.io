<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1a1a1a" />
<title>NESH Taxi and Delivery Services</title>
<meta name="description" content="NESH Taxi and Delivery Services - Fastest delivery in your area. Book taxis, order groceries and food online with NESH." />
<link rel="canonical" href="https://nesh-group.github.io/" />
<link rel="icon" href="NESH-APP/icon-192.png" />
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "NESH Taxi and Delivery",
  "alternateName": "NESH",
  "url": "https://nesh-group.github.io/"
}
</script>
<style>
  :root{--bg:#1a1a1a;--brand:#F2B705;--hero:62vh}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center;overflow:hidden}

  /* Top video area */
  .hero{position:fixed;top:0;left:0;right:0;height:var(--hero);overflow:hidden;background:#000;pointer-events:none}
  .hero iframe{position:absolute;top:50%;left:50%;border:0;
    width:max(100vw,35vh);height:max(var(--hero),177.78vw);
    transform:translate(-50%,-50%) scale(1.3)} /* scale hides YouTube corner icons */
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom,rgba(0,0,0,.15) 0%,rgba(26,26,26,0) 45%,var(--bg) 100%)}

  /* Bottom content */
  .panel{position:fixed;left:0;right:0;bottom:0;height:calc(100% - var(--hero) + 8vh);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:0 20px max(20px,env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(26,26,26,0),var(--bg) 8vh)}
  .logo{margin:0;font-size:clamp(44px,14vw,72px);font-weight:900;font-style:italic;letter-spacing:-1px;color:#fff;line-height:1}
  .logo span{color:var(--brand)}
  h1{margin:18px 0 8px;font-size:clamp(24px,7vw,34px);line-height:1.15;font-weight:800}
  p{margin:0 0 20px;font-size:clamp(14px,4vw,17px);color:#ddd;line-height:1.4}
  .btns{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;margin-top:auto}
  .btn{display:block;width:100%;padding:16px;border-radius:14px;text-decoration:none;font-weight:700;font-size:17px}
  .primary{background:var(--brand);color:#111}
  .secondary{background:transparent;color:#fff;border:2px solid #555}
  .soon{color:#aaa;border-color:#444;cursor:not-allowed}
</style>
</head>
<body>
  <div class="hero">
    <iframe tabindex="-1"
      src="https://www.youtube.com/embed/gOCH0WXI7TQ?autoplay=1&mute=1&loop=1&playlist=gOCH0WXI7TQ&controls=0&modestbranding=1&playsinline=1&rel=0&disablekb=1&fs=0&iv_load_policy=3"
      allow="autoplay; encrypted-media" title="NESH background video"></iframe>
  </div>

  <div class="panel">
    <div class="logo">NE<span>SH</span></div>
    <h1>Taxi &amp; Delivery<br>at your doorstep</h1>
    <p>Book taxis, order groceries and food online.</p>
    <div class="btns">
      <a class="btn primary" href="NESH-APP/">Open NESH App</a>
      <a id="playBtn" class="btn secondary soon">Play Store: Coming Soon</a>
    </div>
  </div>

<script>
  // Early-access testers: share https://nesh-group.github.io/?early=1
  // Everyone else sees "Coming Soon". Remove this block when the app is public.
  (function(){
    var btn=document.getElementById('playBtn');
    var early=false;
    try{
      if(new URLSearchParams(location.search).has('early')) localStorage.setItem('neshEarly','1');
      early=localStorage.getItem('neshEarly')==='1';
    }catch(e){
      early=/[?&]early/.test(location.search);
    }
    if(early){
      btn.href='https://play.google.com/store/apps/details?id=com.neshgroup.nesh';
      btn.target='_blank';btn.rel='noopener';
      btn.textContent='Open Play Store';
      btn.className='btn secondary';
    }
  })();
</script>
</body>
</html>
